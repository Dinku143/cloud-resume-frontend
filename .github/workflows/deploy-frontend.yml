name: Deploy Frontend

# Trigger on every push to main branch
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 3: Upload HTML and CSS to Azure Blob Storage $web container
      # This is what actually updates your live website
      - name: Upload to Azure Blob Storage
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name dinkisacvstorage \
              --destination '$web' \
              --source frontend/ \
              --overwrite \
              --auth-mode key

      # Step 4: Purge Azure Front Door cache
      # Without this, visitors might see the old cached version for hours
      - name: Purge Front Door cache
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az afd endpoint purge \
              --resource-group rg-cloud-resume-challenge \
              --profile-name afd-cloud-resume \
              --endpoint-name dinkisa-resume \
              --domains www.dinkisaworku.com dinkisaworku.com \
              --content-paths '/*'